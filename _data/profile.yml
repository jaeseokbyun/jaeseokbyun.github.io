bio: >-
  I am a research scientist working towards developing practical AI
  algorithms in resource-constrained systems. I received my Ph.D. in Electrical
  and Computer Engineering from <a href="https://www.snu.ac.kr">Seoul National University</a>,
  advised by Taesup Moon, with the Outstanding Dissertation Award. In
  <strong>Fall 2026</strong>, I will join the Agentic AI team at
  <a href="https://aws.amazon.com">Amazon Web Services (AWS)</a> in New York as an
  <strong>(Incoming) Applied Scientist</strong>. During my Ph.D., I worked as a
  research intern at <a href="https://amazon.jobs/content/en/teams/agi">Amazon AGI</a>
  and <a href="https://www.microsoft.com/en-us/research/lab/microsoft-research-asia/">Microsoft Research Asia</a>,
  and as a visiting student researcher at
  <a href="https://web.stanford.edu/~tsachy/group.html">Stanford University</a>.
  My primary research focus lies in image denoising, multi-modal
  representation learning, and agentic AI.
